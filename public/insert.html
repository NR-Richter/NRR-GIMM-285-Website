<!doctype html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Pokemon Team Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</head>

<body data-page='insert'>
    <h1>
        Add Pokemon to the Database
    </h1>

    <div class="container">

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Pokemon Name</label>
            </div>
            <div class='col-md-10'>
                <input id='name' type='text' placeholder='Enter Pokemon name' />
                <div id='error_name' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <label>National Pokedex Number</label>
                <input id='id' type='number' min='1' step='1' placeholder='Enter National Pokedex Number' />
                <div id='error_id' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Form</label>
            </div>
            <div class='col-md-10'>
                <input id='form' type='text' placeholder='Enter Pokemon form (if applicable)' />
                <div id='error_form' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Primary Type</label>
            </div>
            <div class='col-md-10'>
                <select id='primaryType'>
                    <option value=''></option>
                    <option value='Normal'>Normal</option>
                    <option value='Fire'>Fire</option>
                    <option value='Water'>Water</option>
                    <option value='Electric'>Electric</option>
                    <option value='Grass'>Grass</option>
                    <option value='Ice'>Ice</option>
                    <option value='Fighting'>Fighting</option>
                    <option value='Poison'>Poison</option>
                    <option value='Ground'>Ground</option>
                    <option value='Flying'>Flying</option>
                    <option value='Psychic'>Psychic</option>
                    <option value='Bug'>Bug</option>
                    <option value='Rock'>Rock</option>
                    <option value='Ghost'>Ghost</option>
                    <option value='Dragon'>Dragon</option>
                    <option value='Dark'>Dark</option>
                    <option value='Steel'>Steel</option>
                    <option value='Fairy'>Fairy</option>
                </select>
                <div id='error_primaryType' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Secondary Type</label>
            </div>
            <div class='col-md-10'>
                <select id='secondaryType'>
                    <option value=''></option>
                    <option value='Normal'>Normal</option>
                    <option value='Fire'>Fire</option>
                    <option value='Water'>Water</option>
                    <option value='Electric'>Electric</option>
                    <option value='Grass'>Grass</option>
                    <option value='Ice'>Ice</option>
                    <option value='Fighting'>Fighting</option>
                    <option value='Poison'>Poison</option>
                    <option value='Ground'>Ground</option>
                    <option value='Flying'>Flying</option>
                    <option value='Psychic'>Psychic</option>
                    <option value='Bug'>Bug</option>
                    <option value='Rock'>Rock</option>
                    <option value='Ghost'>Ghost</option>
                    <option value='Dragon'>Dragon</option>
                    <option value='Dark'>Dark</option>
                    <option value='Steel'>Steel</option>
                    <option value='Fairy'>Fairy</option>
                </select>
                <div id='error_secondaryType' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Ability One</label>
            </div>
            <div class='col-md-10'>
                <textarea id='ability1' placeholder='Enter ability'></textarea>
                <div id='error_ability1' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Ability Two</label>
            </div>
            <div class='col-md-10'>
                <textarea id='ability2' placeholder='Enter ability'></textarea>
                <div id='error_ability2' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Hidden Ability</label>
            </div>
            <div class='col-md-10'>
                <textarea id='ability3' placeholder='Enter ability'></textarea>
                <div id='error_ability3' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <label>Health</label>
                <textarea id='hp' placeholder='Enter HP'></textarea>
                <div id='error_hp' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <label>Attack</label>
                <textarea id='attack' placeholder='Enter Attack'></textarea>
                <div id='error_attack' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <label>Defense</label>
                <textarea id='defense' placeholder='Enter Defense'></textarea>
                <div id='error_defense' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <label>Special Attack</label>
                <textarea id='spatk' placeholder='Enter Special Attack'></textarea>
                <div id='error_spatk' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <label>Special Defense</label>
                <textarea id='spdef' placeholder='Enter Special Defense'></textarea>
                <div id='error_spdef' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <label>Speed</label>
                <textarea id='speed' placeholder='Enter Speed'></textarea>
                <div id='error_speed' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <input type='checkbox' id='fully_evolved' /><label for='fully_evolved'>Fully Evolved</label>
                <div id='error_fully_evolved' class='text-danger small'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <button id='addPokemon'>Add Pokemon to Database</button>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <div id='insertStatus'></div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <button type='button' id='goToHome'>Return to Database Page</button>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-12'>
                <button type='button' id='goToEditPage'>Go to Edit Page</button>
            </div>
        </div>
    </div>
</body>

<script>
    const allowedTypes = [
        'Normal', 'Fire', 'Water', 'Electric', 'Grass', 'Ice', 'Fighting', 'Poison',
        'Ground', 'Flying', 'Psychic', 'Bug', 'Rock', 'Ghost', 'Dragon', 'Dark', 'Steel', 'Fairy'
    ];

    function clearErrors() {
        const errorTargets = [
            'id', 'name', 'form', 'primaryType', 'secondaryType', 'ability1', 'ability2', 'ability3',
            'hp', 'attack', 'defense', 'spatk', 'spdef', 'speed', 'fully_evolved'
        ];

        for (const target of errorTargets) {
            document.getElementById(`error_${target}`).textContent = '';
        }

        document.getElementById('insertStatus').textContent = '';
    }

    function showErrors(errors) {
        for (const [key, value] of Object.entries(errors)) {
            const errorElement = document.getElementById(`error_${key}`);
            if (errorElement) {
                errorElement.textContent = value;
            }
        }
    }

    function validateStat(rawValue, key, label, errors) {
        const parsedValue = Number.parseInt(rawValue, 10);
        if (!Number.isInteger(parsedValue) || parsedValue < 1 || parsedValue > 255) {
            errors[key] = `${label} must be a whole number between 1 and 255.`;
        }
        return parsedValue;
    }

    function validateFormData(formData) {
        const errors = {};

        if (!/^\d+$/.test(formData.id)) {
            errors.id = 'National Pokedex Number must be a whole number greater than 0.';
        } else {
            const parsedId = Number.parseInt(formData.id, 10);
            if (!Number.isInteger(parsedId) || parsedId < 1) {
                errors.id = 'National Pokedex Number must be a whole number greater than 0.';
            }
        }

        if (formData.name.length === 0) {
            errors.name = 'Pokemon name is required.';
        } else if (formData.name.length > 20) {
            errors.name = 'Pokemon name must be 20 characters or fewer.';
        }

        if (formData.form.length > 20) {
            errors.form = 'Form must be 20 characters or fewer.';
        }

        if (formData.primaryType.length === 0) {
            errors.primaryType = 'Primary type is required.';
        } else if (!allowedTypes.includes(formData.primaryType)) {
            errors.primaryType = 'Primary type is invalid.';
        }

        if (formData.secondaryType.length > 0 && !allowedTypes.includes(formData.secondaryType)) {
            errors.secondaryType = 'Secondary type is invalid.';
        }

        if (formData.secondaryType.length > 0 && formData.secondaryType === formData.primaryType) {
            errors.secondaryType = 'Secondary type must be different from primary type.';
        }

        if (formData.ability1.length === 0) {
            errors.ability1 = 'Ability one is required.';
        } else if (formData.ability1.length > 20) {
            errors.ability1 = 'Ability one must be 20 characters or fewer.';
        }

        if (formData.ability2.length > 20) {
            errors.ability2 = 'Ability two must be 20 characters or fewer.';
        }

        if (formData.ability3.length > 20) {
            errors.ability3 = 'Hidden ability must be 20 characters or fewer.';
        }

        validateStat(formData.hp, 'hp', 'HP', errors);
        validateStat(formData.attack, 'attack', 'Attack', errors);
        validateStat(formData.defense, 'defense', 'Defense', errors);
        validateStat(formData.spatk, 'spatk', 'Special Attack', errors);
        validateStat(formData.spdef, 'spdef', 'Special Defense', errors);
        validateStat(formData.speed, 'speed', 'Speed', errors);

        if (typeof formData.fully_evolved !== 'string' || !['true', 'false'].includes(formData.fully_evolved)) {
            errors.fully_evolved = 'Fully evolved must be true or false.';
        }

        return errors;
    }

    document.getElementById('addPokemon').addEventListener('click', async function (event) {
        event.preventDefault();
        clearErrors();

        const payload = {
            id: document.getElementById('id').value.trim(),
            name: document.getElementById('name').value.trim(),
            form: document.getElementById('form').value.trim(),
            primaryType: document.getElementById('primaryType').value,
            secondaryType: document.getElementById('secondaryType').value,
            ability1: document.getElementById('ability1').value.trim(),
            ability2: document.getElementById('ability2').value.trim(),
            ability3: document.getElementById('ability3').value.trim(),
            hp: document.getElementById('hp').value.trim(),
            attack: document.getElementById('attack').value.trim(),
            defense: document.getElementById('defense').value.trim(),
            spatk: document.getElementById('spatk').value.trim(),
            spdef: document.getElementById('spdef').value.trim(),
            speed: document.getElementById('speed').value.trim(),
            fully_evolved: document.getElementById('fully_evolved').checked ? 'true' : 'false'
        };

        const validationErrors = validateFormData(payload);
        if (Object.keys(validationErrors).length > 0) {
            showErrors(validationErrors);
            document.getElementById('insertStatus').textContent = 'Please fix the errors and submit again.';
            return;
        }

        const requestBody = new FormData();
        for (const [key, value] of Object.entries(payload)) {
            requestBody.append(key, value);
        }

        try {
            const response = await fetch('/pokemon', {
                method: 'POST',
                body: requestBody
            });

            const json = await response.json();

            if (response.status === 201) {
                const isNewSpecies = Boolean(json.data && json.data.createdNewSpecies);
                if (isNewSpecies) {
                    document.getElementById('insertStatus').textContent = `New Pokemon created at National Pokedex #${json.data.id} (${json.data.form} form).`;
                } else {
                    document.getElementById('insertStatus').textContent = `New form added to existing Pokemon #${json.data.id}: ${json.data.form}.`;
                }
                return;
            }

            if ((response.status === 400 || response.status === 409) && json.errors) {
                showErrors(json.errors);
                document.getElementById('insertStatus').textContent = json.message;
                return;
            }

            document.getElementById('insertStatus').textContent = json.message || 'Unable to insert Pokemon.';
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('insertStatus').textContent = 'Network or server error. Please try again.';
        }
    });

    document.getElementById('goToHome').addEventListener('click', function () {
        window.location.href = '/';
    });

    document.getElementById('goToEditPage').addEventListener('click', () => {
        const editId = document.getElementById('id').value.trim();
        const editForm = document.getElementById('form').value.trim();
        const editParams = new URLSearchParams();

        if (editId.length > 0) {
            editParams.set('id', editId);
        }

        if (editForm.length > 0) {
            editParams.set('form', editForm);
        }

        const queryString = editParams.toString();
        window.location.href = queryString.length > 0 ? `edit.html?${queryString}` : 'edit.html';
    });
</script>
</html>
